<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le cahier d'Halloween de Clara (aperçu Edu Studio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ui-bg:#EFE8DC; --ui-fg:#3A2A1F; --ui-bar:#FFFDF8; --ui-line:#D9C8AE; --ui-accent:#6B4423;
  --papier:#FFFFFF; --trait:#3A2A1F; --bois-fonce:#6B4423; --bois:#9C6B3C; --bois-clair:#C8975A;
  --panneau-texte:#FFF6E6; --citrouille:#E57A2E; --mousse:#6E9A47; --or:#E8B547; --echarpe:#4C7AB3;
  --violet:#6A4C93; --peau:#F6D9C0;
  --fantome:#FFFFFF; --encadre:#FBF1E1; --histoire:#EEF4E6; --chemin:#F6DFBC; --doux:#7A6555;
  --gommette-a:#E57A2E; --gommette-b:#4C7AB3; --gommette-c:#6E9A47;
  --semaine-1:#E57A2E; --semaine-2:#4C7AB3; --repere:var(--semaine-1);
  --image-filtre:none; --s:.8;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ui-bg:#1E1915;--ui-fg:#F1E8DA;--ui-bar:#2A231D;--ui-line:#46392D;--ui-accent:#E8B547}
}
:root[data-theme="dark"]{--ui-bg:#1E1915;--ui-fg:#F1E8DA;--ui-bar:#2A231D;--ui-line:#46392D;--ui-accent:#E8B547}
:root[data-impression="nb"]{
  --trait:#222; --bois-fonce:#333; --bois:#BDBDBD; --bois-clair:#E2E2E2; --panneau-texte:#1E1E1E;
  --citrouille:#9E9E9E; --mousse:#6F6F6F; --or:#CFCFCF; --echarpe:#7A7A7A; --violet:#5A5A5A; --peau:#EEEEEE;
  --encadre:#F2F2F2; --histoire:#F2F2F2; --chemin:#E4E4E4; --doux:#555;
  --gommette-a:#666; --gommette-b:#666; --gommette-c:#666; --semaine-1:#444; --semaine-2:#444;
  --image-filtre:grayscale(1) contrast(1.05);
}
body{margin:0;background:var(--ui-bg);color:var(--ui-fg);font-family:Andika,"Trebuchet MS",Verdana,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ui-bar);border-bottom:1px solid var(--ui-line)}
.barre-in{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.barre h1{margin:0;font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:1.05rem;color:var(--ui-accent);margin-right:auto}
.groupe{display:flex;align-items:center;gap:6px;border:0;margin:0;padding:0}
.groupe legend{float:left;font-size:.85rem;margin-right:4px;opacity:.8}
.groupe label{position:relative}
.groupe input{position:absolute;opacity:0;inset:0;margin:0}
.groupe span{display:inline-block;padding:5px 12px;border:1px solid var(--ui-line);border-radius:999px;font-size:.9rem;cursor:pointer;user-select:none}
.groupe input:checked + span{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-bar)}
.groupe input:focus-visible + span, .imprimer:focus-visible, .aller:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.imprimer,.aller{font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;border:1px solid var(--ui-accent);background:transparent;color:var(--ui-fg);cursor:pointer}
.aller{padding:5px 10px;max-width:15rem}
.aide{flex-basis:100%;margin:0;font-size:.8rem;opacity:.7}

.pages{display:flex;flex-direction:column;align-items:center;gap:26px;padding:18px 12px 60px}
.spread{display:flex;flex-direction:column;align-items:center;gap:8px}
.pw-cadre{width:calc(794px * var(--s));height:calc(1123px * var(--s));overflow:hidden;box-shadow:0 2px 14px rgba(60,40,20,.22);background:var(--papier)}
.spread-pages{display:flex;flex-direction:column;gap:22px}
.pw{display:flex;flex-direction:column;gap:6px}
.page-label{font-size:.85rem;opacity:.75}
.legende{display:none}
/* vue planche : doubles pages côte à côte, en miniature */

.vue-planche .pages{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:22px 18px;max-width:1100px;margin:0 auto}
.vue-planche .spread-pages{flex-direction:row;gap:0}
.vue-planche .page-label{display:none}
.vue-planche .legende{display:block;font-size:.78rem;text-align:center;max-width:calc(2 * 794px * var(--s));opacity:.85}
.vue-planche .pw-cadre{cursor:zoom-in}

.page{container-type:inline-size;display:grid;width:794px;height:1123px;transform:scale(var(--s));transform-origin:0 0;background:var(--papier);color:var(--trait);overflow:hidden}
.feuille{min-height:0;display:flex;flex-direction:column;gap:2.2cqw;padding:5.5cqw 5.5cqw 3cqw}
.folio{text-align:center;font-size:calc(1.8cqw * var(--kp,1) * var(--kb,1));color:var(--doux);margin-top:-.8cqw}

.panneau{position:relative;background:
   repeating-linear-gradient(176deg, transparent 0 1.6cqw, rgba(0,0,0,.05) 1.6cqw 1.8cqw),
   linear-gradient(180deg,var(--bois-clair),var(--bois));
  border:.5cqw solid var(--bois-fonce);border-radius:1.8cqw;padding:1cqw 4.2cqw 1.1cqw;color:var(--panneau-texte)}
.panneau::before,.panneau::after{content:"";position:absolute;top:50%;width:1.4cqw;height:1.4cqw;margin-top:-.7cqw;border-radius:50%;background:var(--bois-fonce)}
.panneau::before{left:1.4cqw}.panneau::after{right:1.4cqw}
.panneau h2{margin:0;font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:calc(4cqw * var(--kp,1) * var(--kb,1));line-height:1.05;text-shadow:0 .25cqw 0 rgba(0,0,0,.18)}
.tag{display:inline-block;margin-bottom:.3cqw;padding:.2cqw 1.8cqw;border-radius:999px;background:var(--repere);color:var(--papier);font-family:Grandstander,Andika,sans-serif;font-weight:600;font-size:calc(2.2cqw * var(--kp,1) * var(--kb,1))}
.entete{display:flex;align-items:center;justify-content:space-between;gap:3cqw}
.entete .panneau{flex:1}
.entete .prenom{font-size:calc(2.4cqw * var(--kp,1) * var(--kb,1));text-align:right;line-height:1.2}
.entete .prenom b{display:block;font-family:Grandstander,Andika,sans-serif;font-size:calc(3.6cqw * var(--kp,1) * var(--kb,1));color:var(--bois-fonce)}

.explique,.histoire{border:.4cqw solid var(--bois-fonce);border-radius:2.6cqw;padding:1.4cqw 2.4cqw;min-height:0}
.explique{background:var(--encadre);display:flex;flex-direction:column;gap:.8cqw}
.explique .haut{display:flex;align-items:center;gap:1.8cqw}
.explique img{flex:none;width:8.5cqw;height:auto;display:block;filter:var(--image-filtre)}
.histoire{background:var(--histoire);display:grid;grid-template-columns:5.5cqw 1fr;gap:2cqw;align-items:center}
.histoire svg{width:100%;height:auto;display:block}
.explique h3,.histoire h3{margin:0;font-family:Grandstander,Andika,sans-serif;font-weight:600;font-size:calc(2.3cqw * var(--kp,1) * var(--kb,1));color:var(--doux)}
.mot{display:flex;flex-wrap:wrap;gap:0 1.6cqw;align-items:baseline}
.mot .maj{font-weight:700;font-size:calc(3.4cqw * var(--kp,1) * var(--kb,1));letter-spacing:.2cqw;color:var(--bois-fonce)}
.mot .min{font-size:calc(2.6cqw * var(--kp,1) * var(--kb,1));color:var(--bois-fonce)}
.explique p,.histoire p{margin:0;font-size:calc(2.35cqw * var(--kp,1) * var(--kb,1));line-height:1.35}
.explique .question{margin-top:.6cqw;font-weight:700}
.rangee-zones > .explique{flex:1;min-width:0;justify-content:center}
.explique,.histoire,.case,.carte,.recit,.bravo,.etape,.consigne,.parent{overflow:hidden}
.consigne,.consignes,.histoire,.parent,.recit,.bravo,.etape,.entete,.folio{flex:none}
.zones{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.4cqw}
.zone{flex:1;min-height:0;display:flex;flex-direction:column;border:.35cqw solid var(--bois-fonce);border-radius:2.4cqw;padding:1.6cqw 2.2cqw}
.rangee-zones{min-height:0;display:flex;gap:2.4cqw}
.rangee-zones > .zone{flex:1;min-width:0}
.rangee-zones.demi .consigne{align-items:flex-start}
.consigne{display:flex;align-items:center;gap:1.4cqw;font-size:calc(2.4cqw * var(--kp,1) * var(--kb,1));font-weight:700;line-height:1.3;margin-bottom:.6cqw}
.consignes{display:flex;flex-wrap:wrap;gap:0 4cqw}
.consigne .n{flex:none;width:4cqw;height:4cqw;border-radius:50%;background:var(--repere);color:var(--papier);display:grid;place-items:center;font-family:Grandstander,Andika,sans-serif;font-size:calc(2.3cqw * var(--kp,1) * var(--kb,1))}
.consigne svg{flex:none;width:4.6cqw;height:4.6cqw}
.contenu{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.contenu > svg{width:100%;height:100%;display:block}
.parent{margin:0;font-size:calc(1.95cqw * var(--kp,1) * var(--kb,1));line-height:1.35;color:var(--doux);border-top:.3cqw dashed var(--doux);padding-top:1cqw}
.parent b{color:var(--trait)}
.parent br{display:block;content:'';margin-top:.6cqw}
.lettres{text-align:center;font-family:Grandstander,Andika,sans-serif;font-weight:800;line-height:1;color:var(--papier);-webkit-text-stroke:.45cqw var(--trait);paint-order:stroke;white-space:nowrap}

.couverture .feuille{gap:3cqw;padding-bottom:5.5cqw}
.couverture .panneau{text-align:center;padding:2.6cqw 6cqw}
.couverture .panneau h2{font-size:calc(8.4cqw * var(--kp,1) * var(--kb,1))}
.sous-titre{margin:.6cqw 0 0;font-size:calc(3cqw * var(--kp,1) * var(--kb,1));font-weight:700}
.illustration{flex:1;min-height:0;border:.5cqw solid var(--bois-fonce);border-radius:3cqw;overflow:hidden}
.illustration img{width:100%;height:100%;object-fit:cover;object-position:52% 50%;display:block;filter:var(--image-filtre)}
.appartient{text-align:center;font-size:calc(3.2cqw * var(--kp,1) * var(--kb,1))}
.appartient b{display:block;margin-top:.6cqw;font-family:Grandstander,Andika,sans-serif;font-size:calc(8cqw * var(--kp,1) * var(--kb,1));color:var(--bois-fonce)}

.recit{background:var(--encadre);border:.4cqw solid var(--bois-fonce);border-radius:3cqw;padding:3cqw 4cqw;font-size:calc(3.4cqw * var(--kp,1) * var(--kb,1));line-height:1.5}
.recit p{margin:0}
.etapes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:2cqw}
.etape{display:grid;grid-template-columns:7cqw 12cqw 1fr;gap:3cqw;align-items:center;font-size:calc(3.6cqw * var(--kp,1) * var(--kb,1));font-weight:700}
.etape .n{width:7cqw;height:7cqw;border-radius:50%;background:var(--repere);color:var(--papier);display:grid;place-items:center;font-family:Grandstander,Andika,sans-serif;font-size:calc(4cqw * var(--kp,1) * var(--kb,1))}
.etape svg{width:12cqw;height:12cqw}
.ouv-bas{display:grid;grid-template-columns:26cqw 1fr;gap:3cqw;align-items:end}
.ouv-bas img{width:100%;filter:var(--image-filtre)}

.cartes{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.4cqw}
.carte{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:3cqw;align-items:center;border:.5cqw solid var(--repere);border-radius:3cqw;padding:2cqw 3cqw}
.carte svg{width:100%;height:100%;max-height:100%}
.carte .maj{display:block;font-weight:700;font-size:calc(6cqw * var(--kp,1) * var(--kb,1));letter-spacing:.3cqw;color:var(--bois-fonce)}
.carte .min{display:block;font-size:calc(5cqw * var(--kp,1) * var(--kb,1));color:var(--bois-fonce)}

.semaine{display:flex;flex-direction:column;gap:1.2cqw;flex:1;min-height:0}
.semaine h3{margin:0;display:flex;align-items:center;gap:1.6cqw;font-family:Grandstander,Andika,sans-serif;font-weight:600;font-size:calc(3.4cqw * var(--kp,1) * var(--kb,1));color:var(--bois-fonce)}
.semaine h3::before{content:"";width:2.4cqw;height:2.4cqw;border-radius:50%;background:var(--c)}
.rangee{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2cqw}
.case{display:flex;flex-direction:column;align-items:center;gap:.6cqw;border:.3cqw dashed var(--bois-clair);border-radius:2cqw;padding:1.4cqw .8cqw;text-align:center;min-height:0}
.case svg{width:100%;flex:1;min-height:0}
.case .num{font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:calc(3.4cqw * var(--kp,1) * var(--kb,1));color:var(--c)}
.case .t{font-size:calc(1.9cqw * var(--kp,1) * var(--kb,1));line-height:1.2;color:var(--doux)}
.case.large{flex:1;flex-direction:row;justify-content:center;gap:3cqw}
.case.large svg{flex:none;width:14cqw;height:100%}
.case.large .t{font-size:calc(2.8cqw * var(--kp,1) * var(--kb,1));color:var(--bois-fonce);font-weight:700}
.bravo{display:grid;grid-template-columns:16cqw 1fr;gap:3cqw;align-items:center;background:var(--encadre);border:.4cqw solid var(--bois-fonce);border-radius:3cqw;padding:1.6cqw 3cqw}
.bravo img{width:100%;display:block;filter:var(--image-filtre)}
.bravo p{margin:0;font-size:calc(3cqw * var(--kp,1) * var(--kb,1));line-height:1.4}

@media print{
  @page{size:210mm 297mm;margin:0}
  :root{padding:0}
  html,body{background:#fff}
  .barre,.page-label,.legende{display:none !important}
  .pages,.spread,.spread-pages,.pw{display:block !important;padding:0;gap:0}
  .pw-cadre{width:auto !important;height:auto !important;overflow:visible;box-shadow:none}
  .page{width:210mm !important;height:297mm !important;transform:none !important;break-after:page}
}
.explique p,.histoire p{font-size:calc(3.1cqw * var(--kp,1) * var(--kb,1))}
.consigne{font-size:calc(2.9cqw * var(--kp,1) * var(--kb,1))}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="silhouette"><feFlood style="flood-color:var(--trait)"/><feComposite in2="SourceAlpha" operator="in"/></filter>
</defs></svg>
<header class="barre">
  <div class="barre-in">
    <h1>Le cahier de Clara, aperçu A4</h1>
    <fieldset class="groupe"><legend>Vue</legend>
      <label><input type="radio" name="vue" value="pages" checked><span>Pages</span></label>
      <label><input type="radio" name="vue" value="planche"><span>Planche</span></label>
    </fieldset>
    <fieldset class="groupe"><legend>Impression</legend>
      <label><input type="radio" name="impression" value="couleur" checked><span>Couleur</span></label>
      <label><input type="radio" name="impression" value="nb"><span>Noir et blanc</span></label>
    </fieldset>
    <select class="aller" id="aller" aria-label="Aller à une page"></select>
    <button class="imprimer" type="button" id="imprimer">Imprimer</button>
    <p class="aide">Vue Planche : touchez une double page pour l'ouvrir en grand. Pour imprimer : bouton ou Ctrl + P, puis « Enregistrer en PDF ».</p>
  </div>
</header>
<main class="pages" id="pages"></main>
<script>
const IMG = { couverture: "../donnees/themes/halloween/images/couverture.jpg", citrouille: "../donnees/themes/halloween/images/filou-citrouille.png", cape: "../donnees/themes/halloween/images/filou-cape.png", sorcier: "../donnees/themes/halloween/images/filou-sorcier.png", fantome: "../donnees/themes/halloween/images/filou-fantome.png" };
const PRENOM = 'Clara';

/* ---------- Outils ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function melange(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const place=(c,x,y,w,h,vb)=>`<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}">${c}</svg>`;
const C=(c,l)=>l?'var(--papier)':c;
const T='var(--trait)';

/* ---------- Dessins (l = version à colorier) ---------- */
function fantome(o={}, l=false){
  const sw=l?3.4:3;
  let s=`<path d="M20 102 V45 A30 30 0 0 1 80 45 V102 L70 94 L60 102 L50 94 L40 102 L30 94 Z" fill="${C('var(--fantome)',l)}" stroke="${T}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  if(o.bras) s+=`<path d="M21 64 Q7 58 10 45 M79 64 Q93 58 90 45" fill="none" stroke="${T}" stroke-width="${sw}" stroke-linecap="round"/>`;
  s+= o.yeux==='ovale' ? `<ellipse cx="40" cy="48" rx="3.5" ry="7" fill="${T}"/><ellipse cx="60" cy="48" rx="3.5" ry="7" fill="${T}"/>` : `<circle cx="40" cy="48" r="5" fill="${T}"/><circle cx="60" cy="48" r="5" fill="${T}"/>`;
  s+= o.bouche==='o' ? `<circle cx="50" cy="65" r="5" fill="none" stroke="${T}" stroke-width="${sw}"/>` : `<path d="M41 62 Q50 71 59 62" fill="none" stroke="${T}" stroke-width="${sw}" stroke-linecap="round"/>`;
  if(o.noeud) s+=`<path d="M50 16 L39 8 L39 24 Z M50 16 L61 8 L61 24 Z" fill="${C('var(--citrouille)',l)}" stroke="${T}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="50" cy="16" r="3.5" fill="${T}"/>`;
  return s;
}
function citrouille(l=false){
  const f=C('var(--citrouille)',l);
  return `<path d="M50 22 Q47 10 56 5" fill="none" stroke="${l?T:'var(--mousse)'}" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="31" cy="56" rx="22" ry="30" fill="${f}" stroke="${T}" stroke-width="3"/><ellipse cx="69" cy="56" rx="22" ry="30" fill="${f}" stroke="${T}" stroke-width="3"/><ellipse cx="50" cy="56" rx="20" ry="32" fill="${f}" stroke="${T}" stroke-width="3"/>`;
}
function chat(l=false){
  const f=C('var(--bois-fonce)',l);
  return `<path d="M30 92 Q22 62 40 54 L60 54 Q78 62 70 92 Z" fill="${f}" stroke="${T}" stroke-width="3"/>
  <path d="M70 86 Q92 80 86 58" fill="none" stroke="${T}" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 38 L30 10 L46 26 Z M72 38 L70 10 L54 26 Z" fill="${f}" stroke="${T}" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="50" cy="38" r="22" fill="${f}" stroke="${T}" stroke-width="3"/>
  <circle cx="42" cy="36" r="4" fill="${l?T:'var(--or)'}"/><circle cx="58" cy="36" r="4" fill="${l?T:'var(--or)'}"/>
  <path d="M46 46 Q50 50 54 46" fill="none" stroke="${l?T:'var(--papier)'}" stroke-width="2" stroke-linecap="round"/>`;
}
function chauveSouris(l=false){
  const f=C('var(--bois-fonce)',l);
  return `<path d="M50 40 Q30 18 6 30 Q16 38 14 50 Q26 44 32 54 Q40 46 50 52 Q60 46 68 54 Q74 44 86 50 Q84 38 94 30 Q70 18 50 40 Z" fill="${f}" stroke="${T}" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="50" cy="46" rx="11" ry="14" fill="${f}" stroke="${T}" stroke-width="3"/>
  <path d="M42 34 L41 24 L47 32 M58 34 L59 24 L53 32" fill="${f}" stroke="${T}" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="45" cy="44" r="2.6" fill="${l?T:'var(--papier)'}"/><circle cx="55" cy="44" r="2.6" fill="${l?T:'var(--papier)'}"/>`;
}
function araignee(l=false){
  let p=''; [-1,1].forEach(d=>{ [18,30,42,54].forEach((y,i)=>{ p+=`M${50+d*10} ${52+i*3} Q${50+d*30} ${y} ${50+d*38} ${y+16}`; }); });
  return `<path d="M50 0 V36" stroke="${T}" stroke-width="1.6"/><path d="${p}" fill="none" stroke="${T}" stroke-width="3" stroke-linecap="round"/>

/* ---------- Activité bonus : marionnettes et masque ---------- */
function decoupe(cx, cy, r){ /* trait de découpe en pointillés + ciseaux */
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${T}" stroke-width="1.4" stroke-dasharray="4 3"/>`
    + place(PICTOS.ciseaux, cx+r*0.62, cy-r*0.98, 12, 12, '0 0 48 48');
}
function marionnette(k, cx, cy, r){
  let s = decoupe(cx, cy, r);
  if(k==='filou') s += `<image href="${IMG.cape}" x="${cx-r*0.72}" y="${cy-r*0.86}" width="${r*1.44}" height="${r*1.44}" preserveAspectRatio="xMidYMid meet" style="filter:var(--image-filtre)"/>`;
  else if(k==='libre') s += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="${r*0.22}" fill="var(--doux)" font-family="Andika, sans-serif">Dessine un ami</text>`;
  else s += dessin(k, cx-r*0.66, cy-r*0.8, r*1.32, r*1.2, true);
  const nom = k==='filou' ? 'FILOU' : k==='libre' ? '' : maj(k);
  if(nom) s += `<text x="${cx}" y="${cy+r*0.72}" text-anchor="middle" font-size="${Math.min(r*0.2, r*1.5/nom.length)}" font-weight="700" fill="${T}" font-family="Andika, sans-serif">${nom}</text>`;
  return s;
}
function planchePantins(liste, cols, r){
  const lignes=Math.ceil(liste.length/cols), pasX=200/cols, pasY=2*r+14; let s='';
  liste.forEach((k,i)=>{ s+=marionnette(k, pasX*(i%cols)+pasX/2, Math.floor(i/cols)*pasY+r+6, r); });
  return svg(200, lignes*pasY+4, s, 'Marionnettes à découper');
}

      <div class="etape"><span class="n">4</span>${picto('bouche')}<span>Je raconte l'histoire avec mes amis !</span></div>
    </div>
    <aside class="histoire">${picto('livre')}<div><h3>Idées de jeux</h3><p>Rejoue l'histoire de la mission du jour. Joue aux devinettes : « Elle vole la nuit, qui est-ce ? ». Fais parler chaque ami : « Bonjour, je suis le chat ! »</p></div></aside>
    <p class="parent"><b>Matériel :</b> papier épais (160 à 200 g) pour les patrons, crayons, ciseaux à bouts ronds, colle, pailles ou bâtonnets, élastique pour le masque.<br><b>Pour Clara :</b> elle colorie ses grandes marionnettes et décore le masque avec des gommettes ; l'adulte découpe et colle. Gardez les petites pièces hors de sa portée.</p>`, '--repere:var(--or)');
}
function pageMarionnettes(num, enfant){
  const grand = enfant==='Clara';
  const liste = grand ? ['filou','chat','fantome','citrouille'] : ['filou','chat','chauveSouris','fantome','araignee','citrouille','sorciere','libre'];
  return feuilleP(num, `<div class="entete"><div class="panneau"><span class="tag">Activité bonus</span><h2>${grand?'Les grandes marionnettes':'Les marionnettes'}</h2></div><div class="prenom">Pour<b>${enfant}</b></div></div>
    <div class="zones"><section class="zone">${consigne(1,'colorie', grand ? 'Colorie tes amis.' : 'Colorie, puis découpe sur les pointillés.')}<div class="contenu">${planchePantins(liste, 2, grand?44:31)}</div></section></div>`, '--repere:var(--or)');
}
function pageMasque(num){
  return feuilleP(num, `<div class="panneau"><span class="tag">Activité bonus</span><h2>Le masque de Filou</h2></div>
    <div class="zones"><section class="zone"><div class="consignes">${consigne(1,'colorie','Colorie le masque.')}${consigne(2,'colle','Colle une gommette sur chaque rond.')}</div><div class="contenu">${masque()}</div></section></div>
    <p class="parent"><b>Pour l'adulte :</b> imprimez cette page une fois par enfant. Découpez le contour et les yeux, percez les deux petits ronds et passez un élastique. Collez le masque sur du carton fin s'il est trop souple.</p>`, '--repere:var(--or)');
}

/* ---------- Assemblage (ordre de 03-analyse-fonctionnelle, §4) ---------- */
function composer(){
  const pages=[]; const add=(html,label)=>pages.push({html,label});
  let n=1;
  add(pageCouverture(n++),'Page de garde');
  add(pageOuverture(n++),"Ouverture"); add(pageCitrouilles(n++),'Mes citrouilles');
  [1,2].forEach(s=>{
    add(pageImagier(n++,s,0),`Imagier, semaine ${s}`); add(pageImagier(n++,s,1),`Imagier, semaine ${s} (suite)`);
    MISSIONS.filter(m=>m.s===s).forEach(m=>{ add(pageActivites(n++,m),`Mission ${m.n} : activités`); add(pageCreative(n++,m),`Mission ${m.n} : histoire et coloriage`); });
  });
  add(pageFinale(n++),'Mission finale'); add(pageBravo(n++),'Bravo');
  /* activité bonus, imprimée à part */
  add(pageBonusIntro('Bonus 1'),'Bonus : mode d’emploi'); add(pageMarionnettes('Bonus 2','Clara'),'Bonus : grandes marionnettes de Clara');
  add(pageMasque('Bonus 3'),'Bonus : masque de Filou');
  return pages;
}
const PAGES = composer();
const LEGENDES = ['Page de garde','Ouverture et Mes citrouilles','Imagier, semaine 1',
  ...MISSIONS.slice(0,5).map(m=>`Mission ${m.n} : ${m.titre}`),'Imagier, semaine 2',
  ...MISSIONS.slice(5).map(m=>`Mission ${m.n} : ${m.titre}`),'Mission finale et Bravo','Bonus : mode d’emploi et grandes marionnettes','Bonus : masque de Filou'];

function rendre(){
  const spreads=[[0]]; for(let i=1;i<PAGES.length;i+=2) spreads.push([i,i+1].filter(j=>j<PAGES.length));
  document.getElementById('pages').innerHTML = spreads.map((sp,si)=>`<div class="spread" data-spread="${si}">
    <div class="spread-pages">${sp.map(i=>`<div class="pw"><div class="page-label">${i<29?'Page '+(i+1)+' : ':''}${PAGES[i].label}</div><div class="pw-cadre">${PAGES[i].html}</div></div>`).join('')}</div>
    <div class="legende">${sp[0]<29?'p. '+sp.map(i=>i+1).join('–')+' · ':''}${LEGENDES[si]}</div></div>`).join('');
  document.getElementById('aller').innerHTML = `<option value="">Aller à…</option>` + PAGES.map((p,i)=>`<option value="${i<29?'p'+(i+1):'pBonus'+(i-28)}">${i<29?'Page '+(i+1)+' : ':''}${p.label}</option>`).join('');
}
rendre();

/* Échelle d'affichage : la page garde toujours sa taille réelle (794 px), on la réduit visuellement */
function echelle(){
  const planche = document.body.classList.contains('vue-planche');
  const dispo = document.documentElement.clientWidth - 24;
  const s = planche ? Math.min(0.22, (dispo/2 - 12)/794) : Math.min(0.81, dispo/794);
  document.documentElement.style.setProperty('--s', s.toFixed(4));
}
/* Ajustement : si un texte dépasse de son bloc, on réduit les polices de la page jusqu'à ce que tout rentre */
const BLOCS = '.explique,.histoire,.case,.carte,.recit,.bravo,.etape,.consigne,.parent';
const deborde = b => b.scrollHeight>b.clientHeight+3 || b.scrollWidth>b.clientWidth+3;
function ajuster(){
  document.querySelectorAll('.page').forEach(page=>{
    page.style.setProperty('--kp',1);
    /* 1. chaque bloc réduit son propre texte s'il dépasse */
    page.querySelectorAll(BLOCS).forEach(b=>{ let k=1; b.style.setProperty('--kb',1);
      while(deborde(b) && k>0.55){ k-=0.03; b.style.setProperty('--kb',k.toFixed(2)); } });
    /* 2. si la page entière déborde encore, on réduit tout un peu */
    const f=page.querySelector('.feuille'); let kp=1;
    while(deborde(f) && kp>0.7){ kp-=0.03; page.style.setProperty('--kp',kp.toFixed(2)); }
  });
}
echelle(); ajuster();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(ajuster);
window.addEventListener('load', ajuster);
window.addEventListener('resize', echelle);
document.querySelectorAll('input[name=impression]').forEach(i=>i.addEventListener('change',e=>{ document.documentElement.dataset.impression=e.target.value; }));
document.querySelectorAll('input[name=vue]').forEach(i=>i.addEventListener('change',e=>{ document.body.classList.toggle('vue-planche', e.target.value==='planche'); echelle(); }));
document.getElementById('aller').addEventListener('change',e=>{ if(!e.target.value) return; document.querySelector('input[name=vue][value=pages]').click(); document.getElementById(e.target.value).scrollIntoView({behavior:'smooth',block:'start'}); e.target.value=''; });
document.getElementById('pages').addEventListener('click',e=>{ if(!document.body.classList.contains('vue-planche')) return; const pg=e.target.closest('.pw-cadre'); if(!pg) return;
  document.querySelector('input[name=vue][value=pages]').click(); document.body.classList.remove('vue-planche'); echelle(); setTimeout(()=>pg.scrollIntoView({block:'start'}),30); });
document.getElementById('imprimer').addEventListener('click',()=>{ try{ window.print(); }catch(err){} });

</script>
